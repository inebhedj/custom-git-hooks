# custom-git-hooks configuration.
#
# One "key = value" per line, no inline comments. Everything is optional; the
# values below are the defaults. A value can also be set with the environment
# (CGH_TICKET_REGEX=...) or with `git config cgh.ticket-regex ...`, both of
# which take precedence over this file.

# ERE that matches a ticket key at the start of a branch name / commit subject
# ticket_regex = [A-Z][A-Z0-9]+-[0-9]+

# the token used when there is no ticket
# no_ticket = NOJIRA

# ERE a branch name has to match (default: <ticket>-<letters, digits, ->)
# branch_regex =

# space separated globs: commits to these branches have to be confirmed.
# Use "none" to protect nothing.
# protected_branches = master main

# space separated globs: a merge into these branches can bump the version
# (merged branch name ending with -version-major|minor|patch|fix)
# version_branches = master main

# yes / no: push the version commit and its tag after the bump
# version_push = yes
