<p>A 0-s kilépési kód azt jelenti, hogy minden rendben, az 1-es azt, hogy valami hibás. Egy másolásra kész GitHub workflow a <a href="https://github.com/inebhedj/ih-cgh/blob/master/templates/check-pull-request.yml" target="_blank" rel="noopener noreferrer">templates/check-pull-request.yml</a> fájlban van. A <code>templates/</code> fájljai nem aktívak: csak sablonok, amelyeket a saját projektedbe kell másolni.</p>
