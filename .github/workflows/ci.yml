name: CI

# Manual only: run it from the Actions tab ("Run workflow") or with
# `gh workflow run CI --ref <branch>`. It never starts on push or pull request.
on:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu: /bin/sh is dash, which catches bashisms; macos: bash 3.2 and BSD tools
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: shellcheck
        run: |
          shellcheck -x -s sh -S warning \
            install.sh bin/cgh \
            payload/_dispatch payload/cgh-check payload/lib.sh payload/hooks.d/*/* \
            tests/run.sh tests/lib.sh tests/test_*.sh

      - name: Syntax check with dash
        if: runner.os == 'Linux'
        run: |
          for f in install.sh bin/cgh payload/_dispatch payload/cgh-check payload/lib.sh payload/hooks.d/*/* tests/*.sh; do
            dash -n "$f"
          done

      - name: Tests
        run: sh tests/run.sh
