name: Release

# Manual only: Actions tab -> Release -> "Run workflow". It never starts by itself.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "major, minor, patch, release (drops the -pre suffix) or an explicit X.Y.Z"
        required: true
        default: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Only from the default branch
        if: github.ref_name != github.event.repository.default_branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Run the release from the default branch, not from $REF_NAME." >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Tests
        run: sh tests/run.sh

      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: echo "version=$(sh scripts/bump-version.sh "$BUMP")" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "NOJIRA: Releasing version $VERSION"
          git tag -a "v$VERSION" -m "NOJIRA: Releasing version $VERSION"
          git push origin HEAD "v$VERSION"
